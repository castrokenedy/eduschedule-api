services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eduschedule
      POSTGRES_USER: eduschedule
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduschedule -d eduschedule"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/eduschedule
      DB_USERNAME: eduschedule
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      API_USERNAME: ${API_USERNAME:-admin}
      API_PASSWORD: ${API_PASSWORD:?Defina API_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  pgdata:
